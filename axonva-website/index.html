<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary SEO -->
    <title>Axonva Ventures | Web Development & Digital Growth Agency</title>

    <meta
      name="description"
      content="Axonva Ventures is a premier web development and digital growth agency. We build high-performance Next.js websites, React Native mobile apps, and scale businesses with SEO, Google Ads & Meta Ads."
    />

    <meta
      name="keywords"
      content="Axonva Ventures, Axonva, axonvaventures.in, Web Development Company, Next.js Development, React Native Apps, Mobile App Development, Custom Software Development, Digital Growth Agency, SEO Services India, Google Ads Agency, Meta Ads Expert, Full Stack Development, Performance Marketing"
    />

    <meta name="author" content="Axonva Ventures" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#ff5722" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.axonvaventures.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Axonva Ventures | Web Development & Digital Growth Agency"
    />
    <meta
      property="og:description"
      content="Axonva Ventures builds high-performance Next.js websites, React Native mobile apps, and scalable digital growth solutions."
    />
    <meta property="og:url" content="https://www.axonvaventures.in/" />
    <meta property="og:image" content="https://www.axonvaventures.in/logo.webp" />
    <meta property="og:image:alt" content="Axonva Ventures Logo" />
    <meta property="og:site_name" content="Axonva Ventures" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Axonva Ventures | Web Development & Digital Growth Agency"
    />
    <meta
      name="twitter:description"
      content="Web development, mobile apps and digital growth solutions for scaling businesses."
    />
    <meta name="twitter:image" content="https://www.axonvaventures.in/logo.webp" />

    <!-- Structured Data (JSON-LD) for Google Logo, Site Name & Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.axonvaventures.in/#website",
            "url": "https://www.axonvaventures.in/",
            "name": "Axonva Ventures",
            "alternateName": ["Axonva", "Axonva Ventures Agency", "Axonva Tech"],
            "publisher": {
              "@id": "https://www.axonvaventures.in/#organization"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://www.axonvaventures.in/#organization",
            "name": "Axonva Ventures",
            "url": "https://www.axonvaventures.in/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.axonvaventures.in/favicon.png",
              "width": 192,
              "height": 192
            },
            "image": "https://www.axonvaventures.in/logo.webp",
            "description": "Axonva Ventures is a modern web development and digital growth agency specializing in high-performance websites, mobile applications, SEO, and paid performance marketing.",
            "sameAs": [
              "https://www.instagram.com/axonva.ventures/"
            ]
          }
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-[#060517] text-slate-100 antialiased selection:bg-[#ff5722] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
